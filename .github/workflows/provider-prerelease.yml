name: Publish Korean EPUB Annotator preview

on:
  push:
    branches: [prerelease/v1.0.4-beta.1]

permissions:
  contents: write

concurrency:
  group: epub-v1.0.4-beta.1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore browser runtime
        run: python3 restore_distribution.py

      - name: Install pinned ZIP codec and test dependencies
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run prepare:epub
          npm run prepare:epub-icons

      - name: Check standalone manifest and source syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          assert manifest['version']=='1.0.4.1'
          assert 'content_scripts' not in manifest
          assert 'default_popup' not in manifest['action']
          package=json.loads(Path('package.json').read_text())
          assert package['version']=='1.0.4-beta.1'
          assert package['dependencies']['fflate']=='0.8.2'
          assert Path('epub-fflate.js').stat().st_size>1000
          import struct
          for size in (16,32,48,128):
              icon=Path('icons')/f'icon{size}.png'
              data=icon.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',data[16:24])==(size,size), icon
          assert Path('icons/epub-icon-source.png').stat().st_size>1000
          PY
          for f in *.js; do node --check "$f"; done
          node --check tests/epub-generator.test.mjs
          node --test tests/provider-registry.test.mjs tests/provider-settings-ui.test.mjs tests/v1.1.56.52-hunyuan-thinking.test.mjs

      - name: Run EPUB continuation, dictionary and v1.2.8 pooled protocol regressions
        env:
          PYTHONPATH: python/browser-support
        run: |
          python3 -m pip install --user aiosqlite
          python3 tests/test_packed_python.py
          python3 tests/test_headword_aliases.py
          python3 tests/test_upstream_projection_precheck.py
          python3 tests/test_smart_segmentation_context.py
          python3 tests/test_filter_dictionary_people.py
          python3 tests/test_selective_review.py
          python3 tests/test_quantity_bonus.py
          python3 tests/test_dictionary_names.py
          python3 tests/test_name_boundary_regression.py
          python3 tests/test_pos_coverage.py
          python3 tests/test_analysis_performance.py
          python3 tests/test_browser_batch.py
          python3 tests/test_long_text_complexity.py
          python3 tests/test_startup_stats.py
          python3 tests/test_preload.py
          node --test \
            tests/epub-*.test.mjs \
            tests/v1.2.3-pooled-output-protocol.test.mjs \
            tests/v1.2.4-pool-list-only.test.mjs \
            tests/v1.2.5-equivalent-pools-partial-recovery.test.mjs \
            tests/v1.2.6-identical-hangul-keep.test.mjs \
            tests/v1.2.7-merge-rendered-candidate-pools.test.mjs \
            tests/v1.2.8-pos-filter-independent-pool-recovery.test.mjs \
            tests/pos-local-switch.test.mjs \
            tests/epub-v1.2.2-reading-scope.test.mjs \
            tests/v1.2.2-reading-visibility.test.mjs \
            tests/manual-merged-idle-recovery.test.mjs \
            tests/manual-merged-frame-apply.test.mjs \
            tests/manual-partial-review.test.mjs \
            tests/v1.2.0-strict-invalid-review.test.mjs \
            tests/v1.1.56.61-retry-origin-permissions.test.mjs \
            tests/merged-frame-stability.test.mjs \
            tests/experimental-options.test.mjs \
            tests/hunyuan-stream-audit.test.mjs \
            tests/feature-settings-persistence.test.mjs

      - name: Verify v1.0.0 full source context in API, manual, and smart segmentation modes
        run: |
          node --check review-payload.js
          node --test tests/epub-v0.1.18-webcore-context.test.mjs tests/long-text-context-wire.test.mjs tests/smart-segmentation-budget.test.mjs

      - name: Verify EPUB v1.0.0 reading-check defaults and independent review continuation
        run: |
          node --test tests/epub-v1.0.0-reading-default.test.mjs
          node --check annotation-pipeline.js

      - name: Package independent EPUB extension and verify runtime
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,zipfile
          from pathlib import Path
          root=Path.cwd()
          tracked=[Path(x) for x in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if x]
          included=set()
          for p in tracked:
              if not (root/p).is_file():continue
              if len(p.parts)==1 and p.suffix in {'.js','.json','.html','.css'} and p.name not in {'content.js','content.css','popup.js','popup.css','popup.html'}:
                  included.add(p)
              if p.as_posix() in {'THIRD_PARTY_NOTICES.md','README.md','docs/provider-directory.md'}:included.add(p)
          included.add(Path('epub-fflate.js'))
          for folder in ('runtime','icons','third_party'):
              included.update(p.relative_to(root) for p in (root/folder).rglob('*') if p.is_file())
          license_path=root/'node_modules/fflate/LICENSE'
          if license_path.exists():
              (root/'epub-fflate-LICENSE.txt').write_bytes(license_path.read_bytes())
              included.add(Path('epub-fflate-LICENSE.txt'))
          output=root/'Korean-EPUB-Annotator-v1.0.4-beta.1.zip'
          with zipfile.ZipFile(output,'w',allowZip64=True) as z:
              for p in sorted(included):
                  z.write(root/p,'Korean-EPUB-Annotator/'+p.as_posix(),
                      compress_type=zipfile.ZIP_DEFLATED,
                      compresslevel=9 if p.suffix.lower()=='.mdl' else 6)
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for needed in ['manifest.json','epub.html','epub.css','epub-app.js',
                  'epub-core.js','epub-fflate.js','service-worker.js','annotation-pipeline.js',
                  'choice-review.js','manual-review.js','options.html','runtime/models/cong.mdl',
                  'provider-registry.js','provider-directory.js','provider-config.js','provider-adapter.js',
                  'docs/provider-directory.md']:
                  assert 'Korean-EPUB-Annotator/'+needed in names,needed
              for size in (16,32,48,128):
                  assert f'Korean-EPUB-Annotator/icons/icon{size}.png' in names
              assert 'Korean-EPUB-Annotator/content.js' not in names
              assert 'Korean-EPUB-Annotator/popup.html' not in names
              model=z.getinfo('Korean-EPUB-Annotator/runtime/models/cong.mdl')
              assert model.compress_type==zipfile.ZIP_DEFLATED
              assert model.file_size==75854705
              assert hashlib.sha256(z.read(model.filename)).digest()==hashlib.sha256((root/'runtime/models/cong.mdl').read_bytes()).digest()
              assert json.loads(z.read('Korean-EPUB-Annotator/manifest.json'))['version']=='1.0.4.1'
          print('VERIFIED EPUB EXTENSION',output.name,'size',output.stat().st_size,'sha256',hashlib.sha256(output.read_bytes()).hexdigest())
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.4-beta.1 Korean-EPUB-Annotator-v1.0.4-beta.1.zip \
            --target "$GITHUB_SHA" --title "Korean EPUB Annotator v1.0.4-beta.1" --prerelease \
            --notes "同步网页标注器的 OpenRouter 路由、思考控制、模型目录刷新与参考配置，支持 Ollama 和其他本地推理服务。本版也包含非线性章节与折叠栏正文收集，以及已标注 EPUB 的历史下载。"
